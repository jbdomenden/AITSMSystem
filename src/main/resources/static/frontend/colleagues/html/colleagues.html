<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colleagues & Chat | AITSM</title><link rel="stylesheet" href="/shared/css/styles.css"></head><body><div class="app-layout"><aside id="colleagueSidebar" class="sidebar"></aside><main class="content"><section id="utilityHeader" class="utility-bar card"></section><div class="topbar"><div><h1 class="page-title">Colleagues & Chat</h1><p class="page-subtitle">Connect with approved AITSM colleagues and communicate securely.</p></div></div><section class="colleague-layout"><article class="card"><div class="card-head"><h2 class="section-title">Find colleagues</h2></div><input id="colleagueSearch" placeholder="Search name, email, or department"><div id="searchResults" class="colleague-list"></div><h2 class="section-title">Requests</h2><div id="requestList" class="colleague-list"></div></article><article class="card"><div class="card-head"><h2 class="section-title">Conversations</h2></div><div id="conversationList" class="colleague-list"></div></article><article class="card chat-card"><div id="chatTitle" class="card-head"><h2 class="section-title">Select a colleague</h2></div><div id="messageList" class="message-list"><p class="small">Choose an accepted colleague to begin.</p></div><form id="messageForm" class="chat-form hidden"><textarea id="messageBody" maxlength="2000" placeholder="Write a message" required></textarea><button class="btn btn-primary" type="submit">Send</button></form></article></section></main></div><script src="/modules/common/js/app.js"></script><script>const colleagueAdmin=['admin','superadmin'].includes(String(localStorage.getItem('role')||'').toLowerCase());document.getElementById('colleagueSidebar').id=colleagueAdmin?'adminSidebar':'userSidebar';document.write(`<script src="/modules/sidebar/js/${colleagueAdmin?'admin-shell':'user-shell'}.js"><\/script>`);</script><script src="/colleagues/js/colleagues.js"></script></body></html>
