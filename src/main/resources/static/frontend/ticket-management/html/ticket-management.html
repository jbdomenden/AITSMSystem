<!doctype html>
<html>
<head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Ticket Management | AITSM</title><link rel='stylesheet' href='/shared/css/styles.css'><link rel='stylesheet' href='/modules/common/css/table-skeleton.css'></head>
<body>
<div class='app-layout'>
  <aside id='adminSidebar' class='sidebar'></aside>
  <main class='content'>
    <section id='utilityHeader' class='utility-bar card'></section>
    <div class='topbar'>
      <div>
        <h1 class='page-title'>Ticket Management</h1>
        <p class='page-subtitle'>Monitor incoming requests, prioritize work, and update ticket states.</p>
      </div>
    </div>
    <section class='card'>
      <div class='card-head'>
        <div>
          <h3 class='section-title'>Ticket Queue <span class='help-tip' data-help='Search and sort tickets, then update status from the actions menu.'>?</span></h3>
          <p class='section-subtitle'>Focused view of active ticket operations.</p>
        </div>
        <div id='adminTicketCount' class='small'></div>
      </div>
      <div class='form-grid' style='margin-bottom:12px'>
        <div class='form-group'>
          <label for='adminTicketSearch'>Search</label>
          <input id='adminTicketSearch' type='search' placeholder='Ticket ID, title, requester, or category'>
        </div>
        <div class='form-group'>
          <label for='adminTicketStatusFilter'>Status</label>
          <select id='adminTicketStatusFilter'>
            <option value='all'>All statuses</option>
            <option value='open'>Open</option>
            <option value='in progress'>In Progress</option>
            <option value='resolved'>Resolved</option>
            <option value='closed'>Closed</option>
          </select>
        </div>
        <div class='form-group'>
          <label for='adminTicketPriorityFilter'>Priority</label>
          <select id='adminTicketPriorityFilter'>
            <option value='all'>All priorities</option>
            <option value='Critical'>Critical</option>
            <option value='High'>High</option>
            <option value='Medium'>Medium</option>
            <option value='Low'>Low</option>
          </select>
        </div>
        <div class='form-group'>
          <label for='adminTicketSort'>Sort</label>
          <select id='adminTicketSort'>
            <option value='updated-desc'>Updated (latest)</option>
            <option value='updated-asc'>Updated (oldest)</option>
            <option value='priority-desc'>Priority (highest)</option>
            <option value='priority-asc'>Priority (lowest)</option>
            <option value='id-desc'>Ticket ID (latest)</option>
            <option value='id-asc'>Ticket ID (oldest)</option>
          </select>
        </div>
      </div>
      <div class='table-wrap'>
        <table>
          <thead><tr><th>ID</th><th>Requester</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Updated</th><th>Action</th></tr></thead>
          <tbody id='adminTicketRows'></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script src='/modules/sidebar/js/admin-shell.js'></script><script src='/modules/common/js/app.js'></script><script src='/modules/common/js/help.js'></script><script src='/modules/common/js/table-skeleton.js'></script><script src='/ticket-management/js/admin-ticket-management.js'></script>
</body></html>
